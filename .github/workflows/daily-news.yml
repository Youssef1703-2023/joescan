name: Daily Cybersecurity News

on:
  schedule:
    # Run daily at 5:00 AM UTC (8:00 AM Egypt time, accounting for summer time)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest cybersecurity news
        run: node scripts/fetch-news.mjs

      - name: Auto-translate articles to all languages
        run: node scripts/translate-news.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet public/data/dailyNews.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new articles
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "JoeScan Bot"
          git config user.email "bot@joescan.me"
          git add public/data/dailyNews.json
          git commit -m "🤖 auto: daily cybersecurity news + 6-lang translation"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Called in this run. A push made with GITHUB_TOKEN does not start the push workflow.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
    secrets: inherit
