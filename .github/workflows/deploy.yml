name: Deploy to GitHub Pages

on:
  # Manual only. Automatic production deploys use deploy-pages.yml, which calls
  # deploy-cloudflare.yml. Live DNS still points at GitHub Pages until that
  # cutover is done outside this repository. Do not copy index.html over dist/404.html.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL || 'https://joescan-ai-proxy.goet900.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # CI gate: block deploy on type errors or failing tests
      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify public SEO and private route boundaries
        run: node scripts/verify-public-seo.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
