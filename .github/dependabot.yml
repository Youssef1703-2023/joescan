version: 2
updates:
  # Root app dependencies: weekly check
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Cloudflare Worker dependencies
  - package-ecosystem: "npm"
    directory: "/workers/ai-proxy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
